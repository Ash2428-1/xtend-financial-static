name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2 (af-south-1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /tmp
            curl -fsSL -o index.html https://raw.githubusercontent.com/Ash2428-1/xtend-financial-static/main/index.html
            curl -fsSL -o auth.js https://raw.githubusercontent.com/Ash2428-1/xtend-financial-static/main/auth.js
            sudo mv index.html auth.js /var/www/staging.fin.xtend.co/
            sudo chown www-data:www-data /var/www/staging.fin.xtend.co/index.html /var/www/staging.fin.xtend.co/auth.js
            echo "=== Reloading Nginx ==="
            sudo nginx -t && sudo systemctl reload nginx
            echo "=== Done ==="
